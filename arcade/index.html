<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0718">
<title>Selección Arcade</title>
<meta name="description" content="Juego de lucha 2D en el navegador: Luis, Juan Carlos y Sebas se pegan en Málaga.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0c0718; --ink: #f4f0ff; --accent: #f4c20d; --btn: rgba(255,255,255,0.14); --btn-on: rgba(244,194,13,0.55); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Press Start 2P', monospace; }
  #wrap { position: relative; width: min(100vw, calc(100vh * 16 / 9)); width: min(100vw, calc(100dvh * 16 / 9)); aspect-ratio: 16 / 9; }
  canvas { width: 100%; height: 100%; display: block; background: #000; box-shadow: 0 0 40px rgba(232,66,58,0.25); }
  #touch { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #touch.show { display: block; }
  #tpad { position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: 18px; width: 150px; height: 150px; border-radius: 50%; background: var(--btn); border: 2px solid rgba(255,255,255,0.25); pointer-events: auto; touch-action: none; }
  #tknob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255,255,255,0.35); }
  .tb { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: var(--btn); border: 2px solid rgba(255,255,255,0.3); color: #fff; font: 11px 'Press Start 2P', monospace; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; }
  .tb.on { background: var(--btn-on); }
  .tb[data-btn=p] { right: 158px; bottom: 30px; }
  .tb[data-btn=k] { right: 86px; bottom: 70px; }
  .tb[data-btn=s] { right: max(16px, env(safe-area-inset-right)); bottom: 112px; background: rgba(232,66,58,0.35); }
  .tb[data-btn=start] { width: 64px; height: 30px; border-radius: 15px; font-size: 7px; right: 50%; margin-right: -32px; top: 8px; }
  #rotate { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 9; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 12px; line-height: 2; color: var(--accent); }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="1280" height="720" aria-label="Juego de lucha Selección Arcade"></canvas></div>
  <div id="touch" aria-hidden="true">
    <div id="tpad"><div id="tknob"></div></div>
    <div class="tb" data-btn="p">P</div>
    <div class="tb" data-btn="k">K</div>
    <div class="tb" data-btn="s">SP</div>
    <div class="tb" data-btn="start">START</div>
  </div>
  <div id="rotate">Gira el móvil<br>en horizontal ↻</div>
  <noscript>Este juego necesita JavaScript.</noscript>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/fighter.js"></script>
  <script src="js/render.js"></script>
  <script src="js/sprite-data.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/frame-index.js"></script>
  <script src="js/frames.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/stage-index.js"></script>
  <script src="js/calle-roster.js"></script>
  <script src="js/calle-stage.js"></script>
  <script src="js/calle.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
