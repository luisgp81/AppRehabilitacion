start_gcode = ;===== CC_START_GCODE (perfil Elegoo Centauri Carbon) =====\nM400 ; wait for buffer to clear\nM220 S100 ;Set the feed speed to 100%\nM221 S100 ;Set the flow rate to 100%\nM104 S140\nM140 S{first_layer_bed_temperature[0]}\nG90\nG28 ;home\nM729 ;Clean Nozzle\nM106 P2 S255\nM190 S{first_layer_bed_temperature[0]}\nM106 P2 S0\nM106 P3 S200 ;chamber fan - prevent PLA jamming\nM204 S4000\nG1 X128 Y-1.2 F20000\nG1 Z0.3 F900\nM109 S{first_layer_temperature[0]}\nM83\nG92 E0 ;Reset Extruder\nG1 F6000\nG1 X-1.2 E10.156 ;Draw the first line\nG1 Y98.8 E7.934\nG1 X-0.5 Y100 E0.1\nG1 Y-0.3 E7.934\nG1 X78 E6.284\nG1 F1680\nG1 X98 E2\nG1 F8400\nG1 X118 E2\nG1 F1680\nG1 X138 E2\nG1 F8400\nG1 X158 E2\nG1 X178 E2\nG3 I-1 J0 Z0.6 F1200.0 ;Move to side a little\nG1 F20000\nG92 E0 ;Reset Extruder\nSET_PRINT_STATS_INFO TOTAL_LAYER=[total_layer_count]\n;LAYER_COUNT:[total_layer_count]
end_gcode = ;===== CC_END_GCODE =====\nM400 ; wait for buffer to clear\nM140 S0 ;Turn-off bed\nM106 S255 ;Cooling nozzle\nM83\nG92 E0 ; zero the extruder\nG2 I1 J0 Z{max_layer_z+0.5} E-1 F3000 ; lower z a little\nG90\n{if max_layer_z > 50}G1 Z{min(max_layer_z+50, max_print_height+0.5)} F20000{else}G1 Z100 F20000{endif} ; Move print head up\nM204 S5000\nM400\nM83\nG1 X202 F20000\nM400\nG1 Y250 F20000\nG1 Y264.5 F1200\nM400\nG92 E0\nM104 S0 ;Turn-off hotend\nM140 S0 ;Turn-off bed\nM106 S0 ; turn off fan\nM106 P2 S0 ; turn off remote part cooling fan\nM106 P3 S0 ; turn off chamber cooling fan\nM84 ;Disable all steppers
